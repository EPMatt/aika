name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-and-tests
          path: test-results/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          # - os: macos-latest
          #   target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xvfb patchelf libfuse2t64 file
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: pnpm rust clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: pnpm rust test --manifest-path src-tauri/Cargo.toml --workspace
      - run: pnpm cli:build
      - run: pnpm types:generate
      - run: git diff --exit-code -- src/generated
      - name: Build embedded native test app
        if: runner.os == 'Linux'
        run: pnpm desktop:test:build
      - name: Native webview and SQLite integration
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:native
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-quality-evidence
          path: test-results/native/
      - run: pnpm alpha:build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: aika-private-alpha-${{ matrix.target }}
          if-no-files-found: error
          path: artifacts/aika-*-${{ matrix.target }}/
