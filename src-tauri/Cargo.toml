[package]
name = "cal-desktop"
version = "0.1.0-alpha.1"
description = "A desktop calendar"
edition = "2021"
default-run = "cal-desktop"

[lib]
name = "cal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-compat"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"
