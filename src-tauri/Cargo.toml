[package]
name = "cal-desktop"
version = "0.1.0-alpha.1"
description = "A desktop calendar"
edition = "2021"
default-run = "cal-desktop"

[lib]
name = "cal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aika-core = { path = "core" }
ts-rs = { version = "12", features = ["serde-compat"] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"

[features]
native-test = ["dep:tauri-plugin-wdio-webdriver"]

[workspace]
members = ["core", "cli"]
resolver = "2"
