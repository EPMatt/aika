[package]
name = "aika-core"
version = "0.1.0-alpha.1"
edition = "2021"

[dependencies]
aika-domain = { path = "../domain", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-compat"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dirs = "7"
