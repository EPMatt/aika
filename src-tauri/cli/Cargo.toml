[package]
name = "aika-cli"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Command-line access to aika's local calendar"

[dependencies]
serde_json = "1.0.151"
aika-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
iana-time-zone = "0.1"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
